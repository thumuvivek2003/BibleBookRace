# Builds the app and publishes it to GitHub Pages.
#
# No manual setup: `configure-pages` turns Pages on for the repo the first time
# it runs (that is what `enablement` does), so there is no Settings switch to
# flip, no gh-pages branch, and no extra npm dependency.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish, but drop any queued ones in favour of the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches local development; Node 20 is deprecated on the runners.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A broken build should never reach the live site.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run instead of failing with
          # "Get Pages site failed".
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
